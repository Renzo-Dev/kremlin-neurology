version: '3.9'

services:
  backend:
    container_name: php-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/src/:/app
      - ./backend/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./backend/php.ini:/usr/local/etc/php/php.ini
    ports:
      - '5000:5000'
    networks:
      - app_network



networks:
  app_network:
    driver: bridge