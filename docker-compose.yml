version: '3.9'

services:
  backend:
    container_name: php-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/src/:/app
      - ./backend/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./backend/php.ini:/usr/local/etc/php/php.ini
    ports:
      - '5000:5000'
    networks:
      - app_network

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app_network
    depends_on:
      - backend

networks:
  app_network:
    driver: bridge