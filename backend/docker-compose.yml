version: '3.9'

services:
  php-backend:
    container_name: php-backend
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/:/app
      - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./php.ini:/usr/local/etc/php/php.ini
    ports:
      - '5000:5000'
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
